<main class="recover-page">
  <header class="recover-header">
    <a class="brand" routerLink="/home" aria-label="AgroTrack">
      <span class="brand-icon">
        <img src="assets/images/logoagrotrack.png" alt="" />
      </span>
      <span>AgroTrack</span>
    </a>
  </header>

  <section class="recover-content" aria-label="Recuperar contraseña">
    <form class="recover-card" (ngSubmit)="onSubmit()">
      <h1>Recover password</h1>
      <p>We will send you instructions to your email.</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="form.email" autocomplete="email" />

      <p class="form-message" *ngIf="message()">{{ message() }}</p>

      <button type="submit">Send instructions</button>

      <div class="recover-links">
        <a routerLink="/login">Re-enter</a>
      </div>
    </form>
  </section>
</main>
