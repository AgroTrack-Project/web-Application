<main class="login-page">
  <header class="login-header">
    <a class="brand" routerLink="/home" aria-label="AgroTrack">
      <span class="brand-icon">
        <img src="assets/images/logoagrotrack.png" alt="" />
      </span>
      <span>AgroTrack</span>
    </a>
  </header>

  <section class="login-content" aria-label="Inicio de sesión">
    <form class="login-card">
      <h1>Ingresa a tu cuenta</h1>
      <p>Bienvenido de vuelta.</p>

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <button type="submit">Ingresar</button>

      <div class="login-links">
        <span>
          ¿No tienes cuenta?
          <a routerLink="/login">Regístrate</a>
        </span>
        <a routerLink="/login">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </section>

  <a class="back-home" routerLink="/home">Volver al inicio</a>
</main>
